<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MVVM – Todo-list</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
      }
      .done {
        text-decoration: line-through;
        color: #888;
      }
      .error {
        color: #c8483f;
      }
      li {
        margin: 6px 0;
      }
      #filtres {
        margin: 12px 0;
      }
      #filtres .actif {
        background: #fc3;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Todo-list (MVVM)</h1>
    <div id="app">
      <form>
        <input placeholder="Nouvelle tâche" autofocus /> <button>Ajouter</button>
      </form>
      <div id="filtres">
        <button data-filtre="toutes">Toutes</button>
        <button data-filtre="faites">Faites</button>
        <button data-filtre="a-faire">À faire</button>
      </div>
      <p class="error"></p>
      <ul></ul>
      <p class="counter"></p>
    </div>
    <script type="module">
      import { TodoViewModel } from './TodoViewModel.js';
      const vm = new TodoViewModel();

      const app = document.getElementById('app');
      const form = app.querySelector('form');
      const titre = form.querySelector('input');
      const boutons = app.querySelectorAll('#filtres button');
      const erreur = app.querySelector('.error');
      const liste = app.querySelector('ul');
      const compteur = app.querySelector('.counter');

      // commandes : la vue transmet les actions
      form.onsubmit = e => {
        e.preventDefault();
        vm.ajouter(titre.value);
        titre.value = '';
      };
      boutons.forEach(b => {
        b.onclick = () => vm.changerFiltre(b.dataset.filtre);
      });

      // liaisons : la vue suit l'état du ViewModel
      vm.erreur.subscribe(msg => (erreur.textContent = msg));
      vm.restantes.subscribe(n => (compteur.textContent = `${n} tâche(s) à faire`));
      vm.filtre.subscribe(f => {
        boutons.forEach(b => b.classList.toggle('actif', b.dataset.filtre === f));
      });
      vm.visibles.subscribe(todos => {
        liste.innerHTML = '';
        for (const t of todos) {
          const li = document.createElement('li');
          const label = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = t.done;
          cb.onchange = () => vm.basculer(t.id);
          const span = document.createElement('span');
          span.className = t.done ? 'done' : '';
          span.textContent = t.title; // pas d'injection HTML
          label.append(cb, span);
          const x = document.createElement('button');
          x.textContent = '✕';
          x.onclick = () => vm.supprimer(t.id);
          li.append(label, ' ', x);
          liste.append(li);
        }
      });
    </script>
  </body>
</html>
